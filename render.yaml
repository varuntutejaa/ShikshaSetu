services:
  - type: web
    name: shikshasetu-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: MOCK_MODE
        value: true
      - key: LLM_PROVIDER
        value: mock
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
